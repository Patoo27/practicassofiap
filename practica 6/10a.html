<!DOCTYPE html>
<html>
    <head>
        <title>reserva de viaje</title>
    </head>
    <body>
        <h1>Sección 1:</h1>
        <h2>Datos personales</h2>
        <h3>Para realizar la reserva de su viaje por favor complete los siguientes campos con sus datos personales</h3>
        <form>
            <label for="nombre">nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required autocomplete="off">
            <br>
            <label for="correo">correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="cnisd@gmail.com" required autocomplete="off">
            <br>
            <label for="teléfono">número celular</label>
            <input type="text" id="telefono" name="telefono" required autocomplete="off" placeholder="+342 3235-2344">
            <br>
            <label for="acompañantes">número de acompañantes</label>
            <input step min="1" max="5" type="number" id="acompañantes" name="acompañantes" required autocomplete="off">
            <br>
            <label for="lugar">lugar de origen</label>
            <input readonly value="San Salvador" id="lugar" name="origen" placeholder="de donde sale" required autocomplete="off">
            <br>
            <label for="lugar">lugar de destino</label>
            <select id="lugar" name="destino" required>
                <option value="florencia">florencia</option>
                <option value="barcelona">barcelona</option>
                <option value="venecia">venecia</option>
                <option value="lauterbrunnen">lauterbrunnen</option>
            </select>
            <br>
            <label for="fecha">fecha de salida</label>
            <input type="date" id="fecha" name="salida" required autocomplete="off">
            <br>
            <label for="fecha">fecha de regreso</label>
            <input type="date" id="fecha" name="regreso" required autocomplete="off">
            <br>
            <input type="submit" value="Enviar" required>
        </form>
    </body>
</html>

<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Promedio ponderado</title>
    </head>
    <body>
        <script>
            let nombre = prompt("Ingrese el nombre del estudiante:");
            let apellido = prompt("Ingrese el apellido del estudiante:");
            let nota1 = Number(prompt("Ingrese la primera calificación:"));
            let nota2 = Number(prompt("Ingrese la segunda calificación:"));
            let nota3 = Number(prompt("Ingrese la tercera calificación:"));
            let promedio = (nota1 * 0.30) + (nota2 * 0.35) + (nota3 * 0.35);
                
            document.write("<h1>Resultado</h1>");
            document.write("<p>El promedio de notas ponderado de " + nombre + " " + apellido + " es " + promedio.toFixed(1) + "</p>");
        </script>
    </body>
</html>

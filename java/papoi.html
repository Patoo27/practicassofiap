<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 id="texto">soy un h1</h1>

    <script>
        //declarar variables//
        let numero1, numero2, sum;

        //solicitar y guardar el valor de las variables//
        numero1= Number(prompt("ingrese el numero 1: "));
        numero2= Number(prompt ("ingrese el numero 2: "));
        //sumar y guardar en la variable//
        sum= numero1 + numero2;
        //meter el resultado en nuestro h1//
        document.getElementById("texto").innerHTML=sum;
    </script>


</body>
</html>
